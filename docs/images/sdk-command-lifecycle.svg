<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
<title id="title">Robot SDK command lifecycle</title>
<desc id="desc">Flow from application API call through capability check, command registry, protocol codec, WebSocket gateway acknowledgement, typed result and state broadcast.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0d10"/><stop offset="100%" stop-color="#12171d"/></linearGradient>
<marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7f91a3"/></marker></defs>
<rect width="1400" height="690" rx="28" fill="url(#bg2)"/>
<text x="70" y="70" fill="#f5f7fa" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="700">SDK Command Lifecycle</text>
<text x="70" y="106" fill="#8d98a5" font-family="Inter,Segoe UI,Arial" font-size="18">One-shot command completion stays separate from continuous robot-state updates.</text>
<g font-family="Inter,Segoe UI,Arial">
<g transform="translate(70 160)"><rect width="215" height="110" rx="18" fill="#151a20" stroke="#34404b"/><text x="22" y="35" fill="#7dd3fc" font-size="13" font-weight="700">01 • APPLICATION</text><text x="22" y="69" fill="#fff" font-size="22" font-weight="700">API call</text><text x="22" y="94" fill="#a8b2bd" font-size="14">navigateTo(pose)</text></g>
<g transform="translate(330 160)"><rect width="215" height="110" rx="18" fill="#151a20" stroke="#34404b"/><text x="22" y="35" fill="#86efac" font-size="13" font-weight="700">02 • CLIENT</text><text x="22" y="69" fill="#fff" font-size="22" font-weight="700">Guard</text><text x="22" y="94" fill="#a8b2bd" font-size="14">connected + capability?</text></g>
<g transform="translate(590 160)"><rect width="215" height="110" rx="18" fill="#151a20" stroke="#34404b"/><text x="22" y="35" fill="#86efac" font-size="13" font-weight="700">03 • REGISTRY</text><text x="22" y="69" fill="#fff" font-size="22" font-weight="700">Correlate</text><text x="22" y="94" fill="#a8b2bd" font-size="14">cmd-1001 + timeout</text></g>
<g transform="translate(850 160)"><rect width="215" height="110" rx="18" fill="#151a20" stroke="#34404b"/><text x="22" y="35" fill="#fcd34d" font-size="13" font-weight="700">04 • CODEC</text><text x="22" y="69" fill="#fff" font-size="22" font-weight="700">Encode</text><text x="22" y="94" fill="#a8b2bd" font-size="14">Protocol v1 JSON</text></g>
<g transform="translate(1110 160)"><rect width="215" height="110" rx="18" fill="#151a20" stroke="#34404b"/><text x="22" y="35" fill="#c4b5fd" font-size="13" font-weight="700">05 • TRANSPORT</text><text x="22" y="69" fill="#fff" font-size="22" font-weight="700">Send</text><text x="22" y="94" fill="#a8b2bd" font-size="14">WebSocket → gateway</text></g>
<line x1="285" y1="215" x2="320" y2="215" stroke="#7f91a3" stroke-width="3" marker-end="url(#a2)"/><line x1="545" y1="215" x2="580" y2="215" stroke="#7f91a3" stroke-width="3" marker-end="url(#a2)"/><line x1="805" y1="215" x2="840" y2="215" stroke="#7f91a3" stroke-width="3" marker-end="url(#a2)"/><line x1="1065" y1="215" x2="1100" y2="215" stroke="#7f91a3" stroke-width="3" marker-end="url(#a2)"/>
<rect x="190" y="340" width="1020" height="86" rx="20" fill="#11161b" stroke="#3a444f"/><text x="225" y="374" fill="#f5f7fa" font-size="18" font-weight="700">robot_gateway / ROS 2 execution boundary</text><text x="225" y="402" fill="#9aa6b2" font-size="15">command_ack • typed *_ack payload • command_error</text>
<line x1="1217" y1="270" x2="1217" y2="325" stroke="#7f91a3" stroke-width="3" marker-end="url(#a2)"/>
<g transform="translate(195 495)"><rect width="300" height="120" rx="18" fill="#151a20" stroke="#34404b"/><text x="22" y="35" fill="#86efac" font-size="13" font-weight="700">06 • RESPONSE</text><text x="22" y="69" fill="#fff" font-size="22" font-weight="700">Complete registry</text><text x="22" y="96" fill="#a8b2bd" font-size="14">resolve same command ID</text></g>
<g transform="translate(550 495)"><rect width="300" height="120" rx="18" fill="#151a20" stroke="#34404b"/><text x="22" y="35" fill="#7dd3fc" font-size="13" font-weight="700">07 • PUBLIC RESULT</text><text x="22" y="69" fill="#fff" font-size="22" font-weight="700">RobotResult&lt;T&gt;</text><text x="22" y="96" fill="#a8b2bd" font-size="14">Success(value) / Failure(error)</text></g>
<g transform="translate(905 495)"><rect width="300" height="120" rx="18" fill="#151a20" stroke="#34404b"/><text x="22" y="35" fill="#fcd34d" font-size="13" font-weight="700">IN PARALLEL • BROADCASTS</text><text x="22" y="69" fill="#fff" font-size="22" font-weight="700">StateFlow updates</text><text x="22" y="96" fill="#a8b2bd" font-size="14">telemetry • safety • battery • nav</text></g>
<path d="M700 426 C700 458,345 448,345 485" fill="none" stroke="#7f91a3" stroke-width="3" marker-end="url(#a2)"/><line x1="495" y1="555" x2="540" y2="555" stroke="#7f91a3" stroke-width="3" marker-end="url(#a2)"/><path d="M1020 426 C1020 456,1055 456,1055 485" fill="none" stroke="#7f91a3" stroke-width="3" marker-end="url(#a2)"/>
<text x="70" y="658" fill="#7f8b98" font-size="14">An acknowledgement means the request was accepted; physical progress remains observable through robot-side state broadcasts.</text>
</g></svg>