<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Robot Controller Android module map</title>
<desc id="desc">Application shell depends on feature modules, which share the theme and SDK. The SDK remains framework neutral.</desc>
<defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0d10"/><stop offset="100%" stop-color="#15191f"/></linearGradient><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#75889c"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg3)"/>
<text x="70" y="70" fill="#f5f7fa" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="700">Android Module Topology</text>
<text x="70" y="106" fill="#8d98a5" font-family="Inter,Segoe UI,Arial" font-size="18">Feature-oriented UI modules over shared application infrastructure and an independently consumable SDK.</text>
<g font-family="Inter,Segoe UI,Arial">
